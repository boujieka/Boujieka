# Local and single-host deployment. Not a production hardening guide: see docs/deployment.md.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: access360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d access360"]
      interval: 5s
      retries: 20
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      A360_DATABASE_OWNER_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/access360
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    environment:
      A360_ENV: ${A360_ENV:-production}
      A360_DATABASE_URL: postgresql+psycopg://access360_app:${APP_DB_PASSWORD}@db:5432/access360
      A360_JWT_SECRET: ${A360_JWT_SECRET:?set A360_JWT_SECRET}
      A360_COOKIE_SECURE: ${A360_COOKIE_SECURE:-true}
      A360_CORS_ORIGINS: ${A360_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["8000:8000"]
  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
  storage:
