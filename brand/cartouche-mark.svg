<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" role="img" aria-labelledby="t">
  <title id="t">Cartouche — African Bond Intelligence</title>
  <!-- The cartouche: in ancient Egypt, the ring that encloses a sovereign's name. -->
  <rect x="8" y="4" width="48" height="78" rx="24" fill="#13306b" stroke="#c9a24a" stroke-width="4"/>
  <!-- Base tie (the shen bar) -->
  <rect x="5" y="86" width="54" height="6" rx="2" fill="#c9a24a"/>
  <!-- Sun disk -->
  <circle cx="32" cy="23" r="7" fill="#c9a24a"/>
  <!-- Three rising obelisks: a yield curve read left to right -->
  <path d="M17 72V60l3.5-4 3.5 4v12z" fill="#3fb2a6"/>
  <path d="M28.5 72V51l3.5-4 3.5 4v21z" fill="#3fb2a6"/>
  <path d="M40 72V42l3.5-4 3.5 4v30z" fill="#3fb2a6"/>
</svg>
