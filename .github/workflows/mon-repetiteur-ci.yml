name: mon-repetiteur CI

on:
  push:
    branches: [main, master]
    paths:
      - "mon-repetiteur/**"
      - ".github/workflows/mon-repetiteur-ci.yml"
  pull_request:
    paths:
      - "mon-repetiteur/**"
      - ".github/workflows/mon-repetiteur-ci.yml"

defaults:
  run:
    working-directory: mon-repetiteur

jobs:
  audit:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mon_repetiteur
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mon_repetiteur?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mon-repetiteur/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
