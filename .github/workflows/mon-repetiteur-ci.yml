name: mon-repetiteur CI

on:
  push:
    branches: [main, master]
    paths:
      - "mon-repetiteur/**"
      - ".github/workflows/mon-repetiteur-ci.yml"
  pull_request:
    paths:
      - "mon-repetiteur/**"
      - ".github/workflows/mon-repetiteur-ci.yml"

defaults:
  run:
    working-directory: mon-repetiteur

jobs:
  audit:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mon-repetiteur/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        run: npx supabase start --exclude edge-runtime,logflare,vector,imgproxy

      - name: Export Supabase env vars
        run: |
          npx supabase status -o env > supa.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' supa.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' supa.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' supa.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          rm supa.env

      - name: Generate Supabase types (drift check)
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts || \
            (echo "::error::database.types.ts is out of date — run 'npm run db:types' and commit it." && exit 1)

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
