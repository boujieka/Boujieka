# DiaspoSwap CI - only runs when the diasposwap/ project changes.
name: diasposwap
on:
  push:
    paths: ['diasposwap/**', '.github/workflows/diasposwap.yml']
  pull_request:
    paths: ['diasposwap/**', '.github/workflows/diasposwap.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diasposwap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diasposwap/package-lock.json
      - run: npm ci
      - name: Typecheck (engines, API, mobile)
        run: npm run typecheck
      - name: Tests (unit, property, API e2e)
        run: npm test
      - name: Bundle the mobile app for web
        run: npm run mobile:web:export
