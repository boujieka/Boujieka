<style>
:root {
  color-scheme: light;
  --paper: #f6f0e2; --surface: #fffdf8; --ink: #1a1712; --muted: #5e5546; --line: #e2d8c3;
  --lapis: #13306b; --night: #0b1c44; --gold: #c9a24a; --gold-ink: #8a6a1f; --teal: #1f7a73; --carnelian: #a8432a;
  --display: "Marcellus", Georgia, serif; --body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --paper: #0a1229; --surface: #111c3a; --ink: #f2ead8; --muted: #b9ae97; --line: #26345e; --lapis: #9db4ee; --gold-ink: #e0bd66; --teal: #5cc9bd; }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body); }
a { color: var(--lapis); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.top { background: var(--night); color: #f2ead8; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; color: #f2ead8; text-decoration: none; }
.brand svg { width: 30px; height: 44px; }
.brand b { font: 400 20px/1 var(--display); letter-spacing: .14em; display: block; }
.brand small { font: 600 10px/1 var(--body); letter-spacing: .3em; color: var(--gold); }
.bar-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.bar-r a.link { color: #d9cfb8; text-decoration: none; font-size: 14px; }
.bar-r a.link:hover { color: var(--gold); }
.langs { display: inline-flex; border: 1px solid rgba(201,162,74,.5); border-radius: 2px; overflow: hidden; }
.langs button { background: none; border: 0; color: #d9cfb8; font: 600 12px var(--body); padding: 6px 9px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--gold); color: var(--night); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 3px; font: 600 15px/1.1 var(--body); text-decoration: none; border: 1px solid var(--gold); cursor: pointer; }
.btn.gold { background: var(--gold); color: var(--night); }
.btn.ghost { background: transparent; color: var(--gold); }
.btn.line { background: transparent; color: var(--lapis); border-color: var(--line); }
.hero { padding-block: clamp(28px, 6vw, 72px) clamp(36px, 6vw, 64px); }
.hero h1 { font: 400 clamp(32px, 5vw, 56px)/1.08 var(--display); margin: 10px 0 16px; max-width: 18ch; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero p.lede { font-size: clamp(16px, 1.6vw, 19px); color: #d9cfb8; max-width: 60ch; margin: 0 0 24px; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: #5cc9bd; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: rgba(201,162,74,.35); border: 1px solid rgba(201,162,74,.35); margin-top: 34px; }
.stats div { background: rgba(11,28,68,.92); padding: 14px 16px; }
.stats b { display: block; font: 600 26px/1.15 var(--mono); color: #f2ead8; }
.stats span { font-size: 13px; color: #b9ae97; }
section.band { padding: clamp(40px, 6vw, 72px) 0; }
section.band.alt { background: var(--surface); border-block: 1px solid var(--line); }
h2 { font: 400 clamp(26px, 3.4vw, 36px)/1.15 var(--display); color: var(--lapis); margin: 6px 0 10px; }
.sub { color: var(--muted); max-width: 65ch; margin: 0 0 24px; }
.kicker { font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); padding: 18px; text-decoration: none; color: var(--ink); border-radius: 2px; transition: transform .12s, box-shadow .12s; }
.card:hover, .card:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }

.card span { font-size: 14px; color: var(--muted); }
.card em { margin-top: auto; font-style: normal; font-size: 13px; font-weight: 600; color: var(--gold-ink); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; counter-reset: s; }
.steps div { padding-inline-start: 46px; position: relative; }
.steps div::before { counter-increment: s; content: counter(s); position: absolute; inset-inline-start: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--lapis); color: #fff; font: 600 16px/34px var(--mono); text-align: center; }
.steps b { display: block; color: var(--lapis); }
.steps span { font-size: 14.5px; color: var(--muted); }
form.nl { background: var(--surface); border: 1px solid var(--line); padding: 20px; border-radius: 3px; display: grid; gap: 16px; }
.nl fieldset { border: 1px solid var(--line); padding: 10px 14px 14px; margin: 0; min-width: 0; }

.nl .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.nl .row label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.nl input[type=email], .nl select { font: 500 15px var(--body); padding: 10px 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 2px; }
.nl .note, .note { font-size: 13px; color: var(--muted); }

.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .sim { grid-template-columns: 1fr; } }
.sim-in { display: grid; gap: 12px; background: var(--paper); border: 1px solid var(--line); padding: 16px; border-radius: 3px; }
.sim-in label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }

.presets button[aria-pressed="true"] { background: var(--lapis); color: var(--paper); border-color: var(--lapis); }

.sim-big { font: 600 clamp(26px, 4vw, 38px)/1.1 var(--mono); color: var(--teal); margin: 4px 0 2px; }
.sim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; margin: 14px 0; }
.sim-grid div span { display: block; font-size: 12.5px; color: var(--muted); } .sim-grid div b { font: 600 16px var(--mono); overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

footer { background: var(--night); color: #b9ae97; font-size: 13.5px; padding: 28px 0; }
footer a { color: #d9cfb8; }
.legal { max-width: 80ch; }
[dir="rtl"] .brand b, [dir="rtl"] .langs { direction: ltr; }
@media (max-width: 640px) { .bar-r a.link.hide-m { display: none; } .btn { width: 100%; } .cta { flex-direction: column; } }
</style>

<script id="home-data" type="application/json">__HOME__</script>
<script src="/simcalc.js"></script>
<script>
(function () {
  const H = JSON.parse(document.getElementById("home-data").textContent);
  const LANGS = ["fr", "en", "pt", "es", "ar"], LOC = { fr: "fr-FR", en: "en-GB", pt: "pt-PT", es: "es-ES", ar: "ar-u-nu-latn" };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let lang = store.get("cartouche-lang");
  if (!LANGS.includes(lang)) { const n = (navigator.language || "fr").slice(0, 2).toLowerCase(); lang = LANGS.includes(n) ? n : "fr"; }
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const t = (k, v) => { let s = (H.i18n[lang] || {})[k] ?? H.i18n.fr[k] ?? k; if (v) for (const [a, b] of Object.entries(v)) s = s.split(`{${a}}`).join(b); return s; };
  const nf = (v) => Number(v).toLocaleString(LOC[lang]);
  const date = (s) => s ? new Date(s + "T00:00:00Z").toLocaleDateString(LOC[lang], { day: "2-digit", month: "long", year: "numeric", timeZone: "UTC" }) : "—";
  function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t("home.doc.title");
    let dn = null; try { dn = new Intl.DisplayNames([LOC[lang]], { type: "region" }); } catch {}
    document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
    document.querySelectorAll("[data-ih]").forEach((el) => { el.innerHTML = t(el.dataset.ih); });
    document.querySelectorAll("[data-country]").forEach((el) => { const c = H.countries[el.dataset.country]; el.textContent = lang === "fr" ? c.name_fr : (dn && dn.of(c.iso2)) || c.name_en; });
    document.querySelectorAll("#langs [data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    document.getElementById("nl-lang").value = lang;
    document.getElementById("stats").innerHTML = [
      [nf(H.auctions), t("home.s.auctions")], [nf(H.countries_with_data), t("home.s.countries")], [nf(H.bonds), t("home.s.bonds")], [date(H.last), t("home.s.last")],
    ].map(([v, k]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
    document.getElementById("asof").textContent = t("home.f.asof", { d: date(H.as_of) });
  }
  document.getElementById("langs").addEventListener("click", (e) => { const b = e.target.closest("[data-lang]"); if (b) { lang = b.dataset.lang; store.set("cartouche-lang", lang); render(); } });
  // Market zone boxes tick or untick their countries.
  document.querySelectorAll("[data-zone-box]").forEach((z) => z.addEventListener("change", () => {
    document.querySelectorAll(`[data-zone="${z.dataset.zoneBox}"]`).forEach((c) => { c.checked = z.checked; });
  }));
  document.getElementById("nl-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, st = document.getElementById("nl-st");
    if (!f.reportValidity()) return;
    if (!f.querySelector("[data-market]:checked") && !f.querySelector("[name=desinscription]").checked) { st.textContent = t("home.nl.pick"); return; }
    st.textContent = t("home.nl.sending");
    try {
      const r = await fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(new FormData(f)).toString() });
      if (!r.ok) throw new Error(String(r.status));
      const unsub = f.querySelector("[name=desinscription]").checked;
      f.reset(); document.getElementById("nl-lang").value = lang;
      st.className = "ok"; st.textContent = unsub ? t("home.nl.unsubbed") : t("home.nl.ok");
    } catch { st.className = ""; st.textContent = t("home.nl.err"); }
  });
  // ---------- "What could your money earn?" (published rates × arithmetic; nothing is forecast)
  const PRESETS = [100000, 250000, 500000, 1000000, 5000000, 10000000];
  const SIMH = [1, 3, 5, 7, 10];
  const SIM_DEFAULT = H.sim_countries.includes("CIV") ? "CIV" : H.sim_countries[0];
  let simC = store.get("abm-sim-c"), simH = Number(store.get("abm-sim-h") || 5);
  if (!H.sim_countries.includes(simC)) simC = SIM_DEFAULT;  // a stored country may have lost its points
  if (!SIMH.includes(simH)) simH = 5;
  const cname = (c) => { const x = H.countries[c]; if (!x) return c; if (lang === "fr") return x.name_fr; try { return new Intl.DisplayNames([LOC[lang]], { type: "region" }).of(x.iso2) || x.name_en; } catch { return x.name_en; } };
  const money = (v, cur) => `${Number(v).toLocaleString(LOC[lang], { maximumFractionDigits: 0 })} ${cur}`;
  const pct = (v, d = 2) => `${Number(v).toLocaleString(LOC[lang], { minimumFractionDigits: d, maximumFractionDigits: d })} %`;
  function renderSim() {
    const raw = Number(document.getElementById("s-amt").value), amt = Number.isFinite(raw) && raw > 0 && raw <= 1e12 ? raw : 0;
    document.getElementById("s-presets").innerHTML = PRESETS.map((v) => `<button type="button" data-amt="${v}" aria-pressed="${v === amt}">${Number(v).toLocaleString(LOC[lang])}</button>`).join("");
    document.getElementById("s-c").innerHTML = H.sim_countries.map((c) => `<option value="${c}"${c === simC ? " selected" : ""}>${esc(cname(c))}</option>`).join("");
    const pts = H.points[simC] || {};
    if (!pts[String(simH)]) simH = Number(Object.keys(pts).sort((a, b) => Math.abs(a - simH) - Math.abs(b - simH))[0] || 5);
    document.getElementById("s-h").innerHTML = SIMH.map((h) => `<option value="${h}"${h === simH ? " selected" : ""}${pts[String(h)] ? "" : " disabled"}>${esc(t("sim2.h." + h))}</option>`).join("");
    const p = pts[String(simH)], out = document.getElementById("s-out");
    const st = document.getElementById("s-st");
    if (!amt) { out.innerHTML = `<p class="note">${esc(t("sim2.badamt"))}</p>`; st.textContent = ""; return; }
    const r = p && SimCalc.hold(amt, p.y, p.coupon, simH);
    if (!r) { out.innerHTML = `<p class="note">${esc(t("sim2.norate"))}</p>`; st.textContent = ""; return; }
    const re = SimCalc.reinvested(amt, p.y, simH), sn = SimCalc.sensitivity(p.y, p.coupon, simH);
    const num2 = (v) => Number(v).toLocaleString(LOC[lang], { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    out.innerHTML = `<span class="tag">${esc(t("sim2.tag.calc"))}</span>
      <p style="margin:10px 0 0">${esc(t("sim2.could", { a: money(amt, p.cur), h: t("sim2.h." + simH) }))}</p>
      <div class="sim-big"><bdi dir="ltr">+${esc(money(r.gain, p.cur))}</bdi></div>
      <p class="note" style="margin:0">${esc(t("sim2.total", { v: money(r.total, p.cur) }))}</p>
      <div class="sim-grid">
        <div><span><span class="tag">${esc(t("home.fact"))}</span> ${esc(t("sim2.rate"))}</span><b>${pct(p.y)}</b></div>
        ${p.coupon != null ? `<div><span><span class="tag">${esc(t("home.fact"))}</span> ${esc(t("sim2.coupon"))}</span><b>${pct(p.coupon)}</b></div><div><span>${esc(t("sim2.price"))}</span><b>${num2(r.price)}</b></div>` : ""}
        <div><span>${esc(t("sim2.income"))}</span><b>${esc(money(r.annual, p.cur))}</b></div>
        <div><span>${esc(t("sim2.capital"))}</span><b>${esc(money(r.capital, p.cur))}</b></div>
        <div><span>${esc(t("sim2.reinv"))}</span><b>${esc(money(re, p.cur))}</b></div>
      </div>
      ${sn ? `<p class="note">${esc(t("sim2.sens", { down: pct(Math.abs(sn.down) * 100, 1), up: pct(sn.up * 100, 1) }))}</p>` : ""}
      <p class="note">${esc(t("sim2.source", { d: date(p.d), n: p.name, s: p.src }))} <a href="${esc(/^https:\/\//.test(p.url) ? p.url : "#")}" target="_blank" rel="noopener noreferrer" aria-label="PDF : ${esc(p.name)}">PDF</a></p>`;
    st.textContent = t("sim2.total", { v: money(r.total, p.cur) });
    store.set("abm-sim-c", simC); store.set("abm-sim-h", String(simH));
  }
  document.getElementById("s-amt").addEventListener("input", renderSim);
  document.getElementById("s-presets").addEventListener("click", (e) => { const b = e.target.closest("[data-amt]"); if (b) { document.getElementById("s-amt").value = b.dataset.amt; renderSim(); } });
  document.getElementById("s-c").addEventListener("change", (e) => { simC = e.target.value; renderSim(); });
  document.getElementById("s-h").addEventListener("change", (e) => { simH = Number(e.target.value); renderSim(); });
  const _render = render;
  render = function () { _render(); renderSim(); };
  render();
})();
</script>
</body>
</html>
