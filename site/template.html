    let ticking = false;
    addEventListener("scroll", () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { $("totop").hidden = scrollY < innerHeight * 1.2; ticking = false; }); }, { passive: true });
    $("totop").addEventListener("click", () => { scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); document.querySelector(".brand").focus({ preventScroll: true }); });
    // Redraw charts at their real pixel width (text stays 11-12px on phones).
    if ("ResizeObserver" in window) {
      let w = 0, tmr = 0;
      new ResizeObserver((es) => { const nw = Math.round(es[0].contentRect.width); if (nw === w) return; const first = !w; w = nw; if (first) return; clearTimeout(tmr); tmr = setTimeout(redrawMarket, 120); }).observe($("mk"));
    }
  }

  // ---------- Wiring
  function renderCountryViews() {
    renderCountryBar(); renderTape(); renderTiles(); renderProfile(); renderGrid(); renderSignals(); renderWall();
    renderMarket(); renderBrief(); renderBuyers(); renderSimOps(); computeSim(); renderVeille(); renderSources();
  }
  function renderAll() {
    renderBanner(); renderStele(); renderCountryViews(); renderStrategy(); renderReports(); renderOffers(); renderGlossary(); renderRoadmap();
  }
  function setCountry(iso, keepTable) {
    C = AF[iso] ? iso : ""; store.set("cartouche-country", C);
    if (!keepTable) { tb.q = ""; tb.flash = null; tb.n = 25; }
    if (pf && C && cellsOf(C).length && pf.length === 1) pf = [{ c: C, b: cellsOf(C)[0].bucket, w: 100 }];
    renderCountryViews(); renderPf();
    history.replaceState(null, "", C ? `#${C.toLowerCase()}` : location.pathname + location.search);
  }
  $("gsel").addEventListener("change", (e) => setCountry(e.target.value));
  $("gall").addEventListener("click", () => setCountry(""));
  $("langs").addEventListener("click", (e) => { const b = e.target.closest("[data-lang]"); if (b && b.dataset.lang !== lang) { setLang(b.dataset.lang); renderAll(); } });
  ["b-cur", "b-mat", "b-yld", "b-up"].forEach((id) => $(id).addEventListener("input", renderBuyerMatches));
  if (MODE === "real") $("b-up").value = "0";
  $("s-op").addEventListener("change", (e) => loadOp(e.target.value));
  ["s-kind", "s-nom", "s-yld", "s-days", "s-basis", "s-conv", "s-years", "s-cpn", "s-fee", "s-tax"].forEach((id) => $(id).addEventListener("input", computeSim));
  $("gq").addEventListener("input", renderGlossary);
  // Market section controls (delegated: the section is re-rendered on country/period changes)
  $("mk").addEventListener("click", (e) => {
    const p = e.target.closest("[data-mp]");
    if (p) { mkP = p.dataset.mp; tb.n = 25; renderMarket(); return; }
    const hb = e.target.closest("[data-hb]");
    if (hb) { hidB.has(hb.dataset.hb) ? hidB.delete(hb.dataset.hb) : hidB.add(hb.dataset.hb); drawHist($("pl-hist"), C); $("pl-hist").parentElement.querySelector(`[data-hb="${hb.dataset.hb}"]`)?.focus(); return; }
    const so = e.target.closest("[data-sort]");
    if (so) { const k = so.dataset.sort; tb.dir = tb.sort === k ? -tb.dir : (k === "c" || k === "isin" ? 1 : -1); tb.sort = k; renderTable(); $("mk-tbl").querySelector(`[data-sort="${k}"]`)?.focus(); return; }
    if (e.target.closest("#mk-more")) { tb.n += 50; renderTable(); return; }
    if (e.target.closest("#mk-csv")) downloadCsv();
  });
  $("mk").addEventListener("input", (e) => {
    const id = e.target.id;
    if (id === "mk-q") { tb.q = e.target.value; tb.flash = null; tb.n = 25; renderTable(); }
    else if (id === "mk-ty") { tb.ty = e.target.value; tb.n = 25; renderTable(); }
    else if (id === "mk-it") { tb.it = e.target.value; tb.n = 25; renderTable(); }
  });
  // Search: header button, "/" (and Ctrl/Cmd+K) shortcut, combobox keys
  $("sopen").addEventListener("click", openSearch);
  $("sclose").addEventListener("click", () => closeSearch());
  $("sdlg").addEventListener("click", (e) => { if (e.target === $("sdlg")) closeSearch(); });
  $("sdlg").addEventListener("close", () => { $("sq").setAttribute("aria-expanded", "false"); });
  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
    if ((e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); openSearch(); }
  });
  $("sq").addEventListener("input", renderSearch);
  $("sq").addEventListener("keydown", (e) => {
    const n = sRes.length;
    if (e.key === "ArrowDown") { e.preventDefault(); if (n) setActive((sAct + 1) % n); }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (n) setActive((sAct - 1 + n) % n); }
    else if (e.key === "Home" && n && e.ctrlKey) { e.preventDefault(); setActive(0); }
    else if (e.key === "End" && n && e.ctrlKey) { e.preventDefault(); setActive(n - 1); }
    else if (e.key === "Enter") { e.preventDefault(); activate(sAct); }
  });
  $("sres").addEventListener("mousedown", (e) => { if (e.target.closest(".sopt")) e.preventDefault(); });
  $("sres").addEventListener("click", (e) => { const o = e.target.closest(".sopt"); if (o) activate(Number(o.dataset.so)); });
  $("sres").addEventListener("pointermove", (e) => { const o = e.target.closest(".sopt"); if (o && Number(o.dataset.so) !== sAct) setActive(Number(o.dataset.so)); });
  $("pf-add").addEventListener("click", () => { const c = pf.length ? pf[pf.length - 1].c : rows[0].country_iso3; pf.push({ c, b: cellsOf(c)[0]?.bucket, w: 0 }); renderPf(); });
  $("pf-rows").addEventListener("input", (e) => {
    const el = e.target.closest("[data-pf]"); if (!el) return;
    const r = pf[Number(el.dataset.ix)];
    if (el.dataset.pf === "c") { r.c = el.value; r.b = cellsOf(r.c)[0]?.bucket; renderPf(); }
    else if (el.dataset.pf === "b") { r.b = el.value; computePf(); }
    else { r.w = el.value; computePf(); }
  });
  $("pf-rows").addEventListener("click", (e) => { const b = e.target.closest("[data-pfrm]"); if (b) { pf.splice(Number(b.dataset.pfrm), 1); renderPf(); } });
  document.addEventListener("click", (e) => {
    const sim = e.target.closest("[data-sim]");
    if (sim) { renderSimOps(false); $("s-op").value = sim.dataset.sim; loadOp(sim.dataset.sim); return; }
    const go = e.target.closest("[data-go]");
    if (go) { if (go.dataset.goto) jump(go.dataset.go, go.dataset.goto); else setCountry(go.dataset.go); return; }
    const m = e.target.closest("[data-m]");
    if (m) { setCountry(m.dataset.m === C && m.closest("#tiles") ? "" : m.dataset.m); return; }
    const c = e.target.closest("[data-c]");
    if (c) { setCountry(c.dataset.c === C ? "" : c.dataset.c); return; }
    const ty = e.target.closest("[data-t]");
    if (ty) { type = ty.dataset.t; renderSignals(); }
  });

  setLang(lang);
  renderAll();
  initNav();
  window.__cartouche = { setCountry, setLang: (l) => { setLang(l); renderAll(); }, openSearch, ensureMarket, market: () => ({ AU, curvePoints, volData, ovPoints }) };  // used by the site checks
})();
</script>
</body>
</html>
