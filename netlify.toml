# Déploiement de la landing page TasetyGrid (site statique pré-construit).
# Pour régénérer les pages : python3 site/build.py
[build]
  publish = "site/public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
