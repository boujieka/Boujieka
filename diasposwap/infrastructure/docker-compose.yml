# Local stack. PostgreSQL and Redis are provisioned for Phase 4 (Prisma persistence, BullMQ jobs);
# the current API keeps its state in memory and does not connect to them yet.
name: diasposwap
services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment:
      PORT: "3000"
      DIASPOSWAP_SEED_DEMO: "true"
      DIASPOSWAP_ADMIN_KEYS: ${DIASPOSWAP_ADMIN_KEYS:?set DIASPOSWAP_ADMIN_KEYS in .env}
      DIASPOSWAP_WEBHOOK_SECRET: ${DIASPOSWAP_WEBHOOK_SECRET:?set DIASPOSWAP_WEBHOOK_SECRET in .env}
      DATABASE_URL: postgresql://diasposwap:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/diasposwap
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diasposwap
      POSTGRES_USER: diasposwap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
